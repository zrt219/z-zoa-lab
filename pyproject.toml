[project]
name = "z-zoa-lab"
version = "0.1.0"
description = "Z-ZOA Calculation Room: Research workbench for out-of-sample reconstruction and H I validation across the Galactic Zone of Avoidance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=6.1.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "polars>=1.4.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "fastapi>=0.115.0",
    "fastapi-cli>=0.0.5",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0.0",
    "xrpl-py>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"
